[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfv2"
version = "0.2.0"
description = "Codeforces personal analytics CLI"
requires-python = ">=3.8"
dependencies = [
    "click",
    "requests",
    "google-genai",
    "python-dotenv",
]

[project.scripts]
cfv2 = "cfv2.main:cli"

[tool.setuptools.packages.find]
where = ["."]